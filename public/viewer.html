<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer — Construct-AI</title>
<meta name="description" content="Upload a floor plan and get a 3D house.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/viewer.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header class="bar">
  <a class="bar__back" href="/">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    <span>Back</span>
  </a>
  <div class="bar__brand"><b>Construct-AI</b><i>floor plan → 3D</i></div>
  <a class="bar__src" href="https://github.com/Executioner501/3d-Floorplans" target="_blank" rel="noopener">GitHub</a>
</header>

<main class="wrap">

  <!-- ── upload ── -->
  <section class="panel">
    <h1 class="panel__title">Upload a floor plan</h1>
    <p class="panel__sub">
      PNG or JPG of a 2D plan. Nothing is stored — the model is generated and
      returned to you.
    </p>

    <div class="drop" id="drop" tabindex="0" role="button"
         aria-label="Choose a floor plan image">
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
      <div class="drop__empty" id="drop-empty">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v13"/>
        </svg>
        <b>Drop a floor plan here</b>
        <span>or click to browse</span>
      </div>
      <img class="drop__preview" id="preview" alt="" hidden>
      <button class="drop__clear" id="clear" type="button" hidden aria-label="Remove image">&times;</button>
    </div>

    <div class="opts">
      <label class="opt">
        <span>Style</span>
        <select id="style">
          <option value="mixed">Mixed</option>
          <option value="modern">Modern</option>
          <option value="traditional">Traditional</option>
        </select>
      </label>
      <label class="opt">
        <span>Seed <i>optional</i></span>
        <input id="seed" type="number" min="0" step="1" placeholder="random">
      </label>
      <button class="go" id="go" disabled>
        <span class="go__label">Generate</span>
        <span class="go__spin" aria-hidden="true"></span>
      </button>
    </div>

    <p class="sample">
      No plan handy? <button type="button" id="use-sample">Use the sample plan</button>
    </p>

    <div class="alert" id="alert" hidden></div>
  </section>

  <!-- ── output ── -->
  <section class="panel panel--out" id="out" hidden>
    <div class="out__head">
      <div>
        <h2 class="panel__title">Your building</h2>
        <p class="panel__sub" id="recipe">—</p>
      </div>
      <div class="out__acts">
        <button class="mini" id="again" title="Generate a different roof for the same plan">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
          Another roof
        </button>
        <button class="mini" id="dl-bare" title="Download the roofless structure">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Structure
        </button>
        <button class="mini mini--solid" id="dl">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Download GLB
        </button>
      </div>
    </div>

    <figure class="shot">
      <figcaption class="shot__cap">
        <b>With roof</b>
        <span id="roof-note">the generated composition</span>
      </figcaption>
      <div class="stage">
        <canvas id="stage"></canvas>
        <div class="stage__hint">drag to orbit · click to zoom</div>
        <div class="stage__load" id="stage-load" hidden><i></i><i></i><i></i></div>
      </div>
    </figure>

    <figure class="shot">
      <figcaption class="shot__cap">
        <b>Structure only</b>
        <span>the same build without the roof — walls, openings and floor plate</span>
      </figcaption>
      <div class="stage">
        <canvas id="stage-bare"></canvas>
        <div class="stage__hint">drag to orbit · click to zoom</div>
      </div>
    </figure>

    <dl class="stats" id="stats"></dl>
  </section>

</main>

<script type="module" src="/js/viewer.js"></script>
</body>
</html>
